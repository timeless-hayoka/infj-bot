# Local/private DRIFT adapter. Public traffic requires a separately reviewed TLS proxy.
services:
  drift-core:
    image: ${DRIFT_IMAGE:-drift-local:dev}
    build: .
    command: ["python", "-m", "uvicorn", "drift.core.cloud_adapter:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${DRIFT_PORT:-8000}:8000"
    environment:
      DRIFT_OS_ROOT: /var/lib/drift
      DRIFT_USE_GCP: "false"
      DRIFT_USE_LOCAL_EMBEDDINGS: "true"
      DRIFT_ENV: production
      DRIFT_PLUGIN_TOKEN: ${DRIFT_PLUGIN_TOKEN:?Set a private adapter token}
      DRIFT_VAULT_SECRET: ${DRIFT_VAULT_SECRET:?Set a durable private vault signing secret}
      ANONYMIZED_TELEMETRY: "false"
      HF_HUB_OFFLINE: "1"
    volumes:
      - drift-state:/var/lib/drift
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  drift-state:
