name: RCCE-1 live provider connectivity (not scored)

on:
  push:
    branches:
      - research/rcce-1-strategy-transfer
    paths:
      - 'tests/rcce_live_connectivity.py'
      - 'tests/rcce_live_drift_integration.py'
      - 'tests/test_rcce_strict_brain.py'
      - 'core/brain.py'
      - 'core/config.py'
      - '.github/workflows/rcce-live-connectivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Google SDK
        run: python -m pip install 'google-genai>=1,<2'
      - name: Install focused regression dependencies
        run: |
          python -m pip install 'pytest>=9,<10' 'huggingface-hub>=0.30' 'requests>=2.31' 'numpy>=2.0'
          python -m pip install --no-deps -e .
      - name: Verify strict direct-provider regression tests (offline)
        run: |
          python -m compileall -q core/brain.py tests/test_rcce_strict_brain.py
          python -m pytest -q tests/test_rcce_strict_brain.py
      - name: Verify real provider connectivity (NOT scored)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY }}
          DRIFT_PRIMARY_MODEL: gemini-3.5-flash-lite
        run: python tests/rcce_live_connectivity.py
      - name: Verify real DriftBrain primary and critic (NOT scored)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY }}
          DRIFT_PRIMARY_MODEL: gemini-3.5-flash-lite
          DRIFT_CRITIC_MODEL: gemini-3.5-flash-lite
          DRIFT_PREFER_LOCAL: 'false'
          DRIFT_USE_LOCAL_FALLBACK: 'false'
          DRIFT_USE_HF: 'false'
        run: python tests/rcce_live_drift_integration.py
