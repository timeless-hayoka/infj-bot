name: RCCE-1 live CLI crossover pilot

on:
  push:
    branches:
      - validation/rcce-live-independent
    paths:
      - '.github/workflows/rcce-live-crossover.yml'

permissions:
  contents: read

jobs:
  live-cli:
    if: >-
      github.event.head_commit.message == 'ci(rcce): run approved crossover' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real CLI and local state dependencies
        run: |
          python -m pip install 'google-genai==1.75.0' 'huggingface-hub>=0.30' 'chromadb>=1.5' 'numpy>=2.0' requests sympy psutil prometheus-client python-dotenv
          python -m pip install --no-deps -e .
      - name: Exercise actual CLI and live Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY }}
          DRIFT_PRIMARY_MODEL: gemini-3.5-flash-lite
          DRIFT_CRITIC_MODEL: gemini-3.5-flash-lite
          DRIFT_PREFER_LOCAL: 'false'
          DRIFT_USE_LOCAL_FALLBACK: 'false'
          DRIFT_USE_GROQ: 'false'
          DRIFT_USE_KIMI: 'false'
          DRIFT_USE_HF: 'false'
          DRIFT_USE_LOCAL_EMBEDDINGS: 'true'
          DRIFT_BYPASS_CACHE: '1'
          ANONYMIZED_TELEMETRY: 'false'
        run: python tests/rcce_live_crossover.py rcce-live-crossover-evidence.json
      - name: Upload real CLI response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcce-live-crossover-evidence
          path: rcce-live-crossover-evidence.json
          if-no-files-found: error
          retention-days: 30
