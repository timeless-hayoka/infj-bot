name: Stage 1 evidence history validation
on:
  push:
    branches: [validation/stage1-evidence-history]
  workflow_dispatch:
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q core/cognitive_learning_bridge.py tests/test_stage1_evidence_history.py
      - run: python -m pytest -q tests/test_stage1_evidence_history.py tests/test_cognitive_learning_bridge.py
      - name: Adjacent cognitive-learning regression suites (offline)
        env:
          DRIFT_OS_ROOT: ${{ runner.temp }}/drift-stage1
        run: >-
          python -m pytest -q
          tests/test_rcce_strategy_transfer_baseline.py
          tests/test_rcce_transfer.py
          tests/test_rcce_evidence.py
          tests/test_metacognition.py
      - name: Install offline conversational integration dependencies
        run: python -m pip install 'chromadb>=1.5,<2' numpy requests sympy python-dotenv psutil
      - name: Matched conversational prompt restart pilot (no provider)
        run: python -m pytest -q -s tests/test_stage1_conversational_learning.py
      - name: Validate budget, scoring and paired prompt controls
        run: python -m pytest -q tests/test_stage1_live_01.py
      - name: Preflight live pilot without credentials
        run: python tests/stage1_live_01.py prepare "${{ runner.temp }}/stage1-live-preflight"
