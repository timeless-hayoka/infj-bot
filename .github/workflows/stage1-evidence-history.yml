name: Stage 1 evidence history validation
on:
  push:
    branches: [validation/stage1-evidence-history]
  workflow_dispatch:
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q core/cognitive_learning_bridge.py tests/test_stage1_evidence_history.py
      - run: python -m pytest -q tests/test_stage1_evidence_history.py tests/test_cognitive_learning_bridge.py
      - name: Adjacent cognitive-learning regression suites (offline)
        env:
          DRIFT_OS_ROOT: ${{ runner.temp }}/drift-stage1
        run: >-
          python -m pytest -q
          tests/test_rcce_strategy_transfer_baseline.py
          tests/test_rcce_transfer.py
          tests/test_rcce_evidence.py
          tests/test_metacognition.py
