name: Ruff safe autofix batch

on:
  push:
    branches: [maintenance/ruff-runtime-safety]
    paths:
      - .github/workflows/ruff-safe-autofix.yml

permissions:
  contents: write

jobs:
  safe-autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install 'ruff==0.14.6'
      - name: Apply only Ruff safe automatic fixes
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --exclude venv --exclude .venv --exclude chroma_db --ignore E701,E402 --fix --output-format json > ruff-after-safe.json || test "$?" -eq 1
          git diff --check
          python -m compileall -q core tests interfaces memory automation
          git diff --stat
          git status --short
      - name: Commit isolated safe autofix batch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No automatically fixable findings.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(ruff): apply safe autofixes without formatting'
          git push origin HEAD:maintenance/ruff-runtime-safety
