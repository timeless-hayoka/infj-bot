name: DRIFT conversational correction restart
on:
  push:
    branches: [validation/drift-correction-restart]
permissions:
  contents: read
concurrency:
  group: drift-correction-restart
  cancel-in-progress: false
jobs:
  correction:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'test: run approved DRIFT conversational correction restart pair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests/drift_correction_support
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned storage and provider SDK
        run: |
          python -m pip install 'google-genai==1.75.0' 'chromadb==1.5.9' 'httpx==0.28.1' requests sympy psutil prometheus-client python-dotenv rich pexpect
          python -m pip install --no-deps -e .
      - name: Verify store state and Gemini requests offline
        run: |
          python tests/drift_correction_probe.py offline evidence/offline
          python - <<'PY'
          from pathlib import Path
          import json

          report = json.loads(Path("evidence/offline/summary.json").read_text())
          arms = list(report["arms"].values())
          if len(arms) != 3 or any(not a["old_in_prompt"] or a["new_in_prompt"] for a in arms):
              raise SystemExit("Observed offline baseline changed. No live calls made.")
          PY
      - name: Run approved live completed and interrupted correction pair
        env:
          DRIFT_CORRECTION_APPROVED_LIMIT: '4'
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        run: python tests/drift_correction_probe.py live evidence/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-correction-restart-evidence
          path: evidence
          if-no-files-found: warn
          retention-days: 14
