name: DRIFT conversational correction restart
on:
  push:
    branches: [fix/drift-correction-restart]
permissions:
  contents: read
concurrency:
  group: drift-correction-restart
  cancel-in-progress: false
jobs:
  correction:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'fix: resolve explicit memory corrections before ranking'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests/drift_correction_support
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned storage and provider SDK
        run: |
          python -m pip install 'google-genai==1.75.0' 'chromadb==1.5.9' 'httpx==0.28.1' requests sympy psutil prometheus-client python-dotenv rich pexpect
          python -m pip install --no-deps -e .
      - name: Verify store state and Gemini requests offline
        run: |
          python tests/drift_correction_probe.py offline evidence/offline
          python - <<'PY'
          from pathlib import Path
          import json

          report = json.loads(Path("evidence/offline/summary.json").read_text())
          arms = report["arms"]
          expected = {"uncorrected": (True, False), "completed": (False, True), "interrupted": (False, True)}
          for name, markers in expected.items():
              arm = arms[name]
              if (arm["old_in_prompt"], arm["new_in_prompt"]) != markers:
                  raise SystemExit(f"{name}: unexpected offline prompt. No live calls made.")
          if arms["completed"]["request_sha256"] != arms["interrupted"]["request_sha256"]:
              raise SystemExit("Offline corrected requests differ. No live calls made.")
          PY
      - name: Run approved live completed and interrupted correction pair
        env:
          DRIFT_CORRECTION_APPROVED_LIMIT: '4'
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        run: |
          python tests/drift_correction_probe.py live evidence/live
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence/live/summary.json").read_text())
          for name, arm in report["arms"].items():
              if not (arm["new_in_prompt"] and arm["exact_new_reply"] and arm["new_in_cli_reply"]
                      and not arm["old_in_prompt"] and not arm["old_in_reply"] and not arm["old_in_cli_reply"]):
                  raise SystemExit(f"{name}: the corrected value did not pass live scoring.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-correction-restart-evidence
          path: evidence
          if-no-files-found: warn
          retention-days: 14
