name: Ruff first-fix regression

on:
  push:
    branches: [maintenance/ruff-runtime-safety]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cognitive-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools and project without large optional stack
        run: |
          python -m pip install pytest ruff
          python -m pip install --no-deps -e .
      - name: Verify targeted lint and syntax
        run: |
          python -m compileall -q core/cognitive_factory.py tests/test_cognitive_factory_pattern_isolation.py
          ruff check --isolated --select RUF012,E4,E7,E9,F821 core/cognitive_factory.py tests/test_cognitive_factory_pattern_isolation.py
      - name: Run real factory regression tests
        run: python -m pytest -q tests/test_cognitive_factory_pattern_isolation.py
