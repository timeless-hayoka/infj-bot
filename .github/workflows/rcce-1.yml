name: RCCE-1 baseline verification

on:
  pull_request:
    paths:
      - 'core/cognitive_control.py'
      - 'core/cognitive_learning_bridge.py'
      - 'core/logic_chain.py'
      - 'core/rcce_transfer.py'
      - 'tests/test_rcce_strategy_transfer_baseline.py'
      - 'tests/test_rcce_transfer.py'
      - 'tests/test_cognitive_learning_bridge.py'
      - '.github/workflows/rcce-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run RCCE characterization and persistence tests
        run: |
          python -m pytest -q tests/test_rcce_strategy_transfer_baseline.py tests/test_rcce_transfer.py tests/test_cognitive_learning_bridge.py
