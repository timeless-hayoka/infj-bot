name: RCCE-1 baseline verification

on:
  pull_request:
    paths:
      - 'core/cognitive_control.py'
      - 'core/cognitive_learning_bridge.py'
      - 'core/logic_chain.py'
      - 'core/rcce_transfer.py'
      - 'core/rcce_evidence.py'
      - 'core/brain.py'
      - 'tests/test_rcce_strict_brain.py'
      - 'tests/test_rcce_evidence.py'
      - 'tests/test_rcce_strategy_transfer_baseline.py'
      - 'tests/test_rcce_transfer.py'
      - 'tests/test_rcce_process_restart.py'
      - 'tests/test_cognitive_learning_bridge.py'
      - '.github/workflows/rcce-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Check RCCE syntax and critical lint
        run: |
          python -m compileall -q core/cognitive_control.py core/cognitive_learning_bridge.py core/rcce_transfer.py core/rcce_evidence.py tests/test_rcce_evidence.py tests/test_rcce_strict_brain.py tests/test_cognitive_learning_bridge.py tests/test_rcce_strategy_transfer_baseline.py tests/test_rcce_transfer.py tests/test_rcce_process_restart.py
          ruff check --isolated --select E4,E7,E9,F core/cognitive_control.py core/cognitive_learning_bridge.py core/rcce_transfer.py core/rcce_evidence.py tests/test_rcce_evidence.py tests/test_rcce_strict_brain.py tests/test_cognitive_learning_bridge.py tests/test_rcce_strategy_transfer_baseline.py tests/test_rcce_transfer.py

  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install 'pytest>=9,<10' 'huggingface-hub>=0.30' 'requests>=2.31' 'numpy>=2.0'
          python -m pip install --no-deps -e .
        # RCCE modules and their LogicChain dependency use Python's standard library.
        # Avoid installing the full GPU/model stack for deterministic unit tests.
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
      - name: Run RCCE characterization and persistence tests
        run: |
          python -m pytest -q tests/test_rcce_strategy_transfer_baseline.py tests/test_rcce_transfer.py tests/test_cognitive_learning_bridge.py tests/test_rcce_evidence.py tests/test_rcce_strict_brain.py
