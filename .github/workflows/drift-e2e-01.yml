name: DRIFT-E2E-01 cross-process memory pilot

on:
  push:
    branches: [validation/drift-e2e-01]
    paths:
      - '.github/workflows/drift-e2e-01.yml'

permissions:
  contents: read

concurrency:
  group: drift-e2e-01
  cancel-in-progress: false

jobs:
  pilot:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real CLI and storage dependencies
        run: |
          python -m pip install 'google-genai==1.73.1' 'chromadb==1.5.8' 'httpx==0.28.1' requests sympy psutil prometheus-client python-dotenv rich pexpect
          python -m pip install --no-deps -e .
      - name: Run five isolated chat restarts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        run: python tests/drift_e2e/pilot.py drift-e2e-raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-e2e-01-raw
          path: drift-e2e-raw
          if-no-files-found: error
          retention-days: 14

  verify:
    if: always() && github.run_attempt == 1 && needs.pilot.result != 'skipped'
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: drift-e2e-01-raw
          path: drift-e2e-raw
      - name: Independently check actual provider responses and persisted records
        env:
          PYTHONPATH: ''
          ANONYMIZED_TELEMETRY: 'False'
        run: |
          python -m pip install 'chromadb==1.5.8'
          python tests/drift_e2e/verify.py drift-e2e-raw --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output drift-e2e-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-e2e-01-verification
          path: drift-e2e-verification.json
          if-no-files-found: error
          retention-days: 14
