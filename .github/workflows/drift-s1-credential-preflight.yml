name: DRIFT Gemini credential availability (no provider calls)
on:
  push:
    branches: [validation/stage1-evidence-history]
    paths: ['.github/workflows/drift-s1-credential-preflight.yml']
permissions:
  contents: read
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report presence only; never read or print credential values
        env:
          GEMINI_AVAILABLE: ${{ secrets.GEMINI_API_KEY != '' }}
          GOOGLE_AVAILABLE: ${{ secrets.GOOGLE_API_KEY != '' }}
          API_AVAILABLE: ${{ secrets.API_KEY != '' }}
        run: |
          printf 'GEMINI_API_KEY configured: %s\n' "$GEMINI_AVAILABLE"
          printf 'GOOGLE_API_KEY configured: %s\n' "$GOOGLE_AVAILABLE"
          printf 'API_KEY configured: %s\n' "$API_AVAILABLE"
