name: Quality

on:
  push:
    branches: [main, master, maintenance/ruff-runtime-safety]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  safe-autofix:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/maintenance/ruff-runtime-safety') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/maintenance/ruff-runtime-safety') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'maintenance/ruff-runtime-safety')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/ruff-runtime-safety
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff==0.17.6'
      - name: Apply Ruff safe fixes and validate syntax
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --exclude venv --exclude .venv --exclude chroma_db --ignore E701,E402 --fix || test "$?" -eq 1
          ruff format . --exclude venv --exclude .venv --exclude chroma_db
          git diff --check
          python -m compileall -q core tests interfaces memory automation
          git diff --stat
      - name: Inventory remaining Ruff findings
        if: always()
        shell: bash
        run: |
          ruff check . --exclude venv --exclude .venv --exclude chroma_db --ignore E701,E402 --output-format json > ruff-remaining.json || test "$?" -eq 1
          python - <<'PY'
          import collections
          import json
          from pathlib import Path
          path = Path("ruff-remaining.json")
          if path.exists():
              findings = json.loads(path.read_text())
              counts = collections.Counter(item["code"] for item in findings)
              print("REMAINING_RUFF_FINDINGS", len(findings))
              print("REMAINING_RUFF_BY_RULE", dict(counts.most_common()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruff-remaining-inventory
          path: ruff-remaining.json
      - name: Validate changed code before automated commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pip install --no-deps -e .
          python -m pytest -q tests/test_cognitive_factory_pattern_isolation.py tests/test_conflict_detector_pattern_isolation.py
          ruff check --isolated --select E9 core tests interfaces memory automation
          ruff check --isolated --select RUF012,E4,E7,E9,F821 core/cognitive_factory.py tests/test_cognitive_factory_pattern_isolation.py
          ruff format --check . --exclude venv --exclude .venv --exclude chroma_db
          git diff --check
      - name: Commit safe fixes
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(ruff): apply safe automated lint fixes'
          git push origin HEAD:maintenance/ruff-runtime-safety

  factory-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal focused dependencies
        run: |
          python -m pip install pytest 'ruff==0.17.6'
          python -m pip install --no-deps -e .
      - name: Focused syntax and Ruff checks
        run: |
          python -m compileall -q core/cognitive_factory.py core/cognitive_orchestrator.py tests/test_cognitive_factory_pattern_isolation.py tests/test_conflict_detector_pattern_isolation.py
          ruff check --isolated --select RUF012,E4,E7,E9,F821 core/cognitive_factory.py tests/test_cognitive_factory_pattern_isolation.py
      - name: Factory regression tests
        run: python -m pytest -q tests/test_cognitive_factory_pattern_isolation.py tests/test_conflict_detector_pattern_isolation.py

  master-ruff-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff==0.17.6'
      - name: Inventory Ruff findings on master
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > master-sha.txt
          ruff check . --exclude venv --exclude .venv --exclude chroma_db --ignore E701,E402 --output-format json > ruff-master.json || test "$?" -eq 1
          python - <<'PY'
          import collections
          import json
          from pathlib import Path
          findings = json.loads(Path("ruff-master.json").read_text())
          rules = collections.Counter(item["code"] for item in findings)
          files = collections.Counter(Path(item["filename"]).relative_to(Path.cwd()).as_posix() for item in findings)
          print("MASTER_SHA", Path("master-sha.txt").read_text().strip())
          print("TOTAL_FINDINGS", len(findings))
          print("AFFECTED_FILES", len(files))
          print("RULE_COUNTS", json.dumps(dict(sorted(rules.items()))))
          print("FILE_COUNTS", json.dumps(dict(files.most_common())))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruff-master-inventory
          path: |
            ruff-master.json
            master-sha.txt

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ruff==0.17.6' bandit detect-secrets

      - name: Ruff check
        run: ruff check . --exclude venv --exclude .venv --exclude chroma_db --ignore E701,E402

      - name: Ruff format check
        run: ruff format --check . --exclude venv --exclude .venv --exclude chroma_db

      - name: Bandit security scan
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Secret detection
        run: detect-secrets scan --baseline .secrets.baseline --all-files . || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt mypy

      - name: Type check core modules
        run: |
          mypy config.py brain.py memory.py rate_limit.py maintenance.py \
            --ignore-missing-imports --warn-redundant-casts || true
