name: RCCE-1 arithmetic grounding study

on:
  push:
    branches:
      - research/rcce-1-strategy-transfer
    paths:
      - 'tests/rcce_arithmetic_study.py'
      - 'tests/test_rcce_filtered_replay_study.py'
      - '.github/workflows/rcce-arithmetic-study.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  arithmetic-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pilot dependencies
        run: |
          python -m pip install 'google-genai==1.75.0' 'pytest>=9,<10' 'huggingface-hub>=0.30' 'requests>=2.31' 'numpy>=2.0'
          python -m pip install --no-deps -e .
      - name: Verify offline protocol and restart regression
        run: python -m pytest -q tests/test_rcce_filtered_replay_study.py tests/test_rcce_process_restart.py tests/test_rcce_strict_brain.py
      - name: Recover the original run's genuine response prefix
        if: contains(github.event.head_commit.message, '[rcce resume]')
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44917462036
          name: rcce-arithmetic-evidence
          path: prior-evidence
      - name: Run the live arithmetic-study pilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY }}
          DRIFT_PRIMARY_MODEL: gemini-3.5-flash-lite
          RCCE_RESUME_ENABLED: ${{ contains(github.event.head_commit.message, '[rcce resume]') }}
          RCCE_RESUME_COMMIT: 1d28b4f7b7d06690d8138965e72ba503e884d76f
        run: |
          if [ "$RCCE_RESUME_ENABLED" = true ]; then
            export RCCE_RESUME_PATH=prior-evidence/rcce-arithmetic-evidence.json
          fi
          python tests/rcce_arithmetic_study.py evaluate "$RUNNER_TEMP/rcce-arithmetic-history" rcce-arithmetic-evidence.json
      - name: Upload full or partial run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcce-arithmetic-evidence
          path: rcce-arithmetic-evidence.json
          if-no-files-found: warn
          retention-days: 30
