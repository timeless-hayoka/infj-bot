[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["drift", "drift.interfaces", "drift.evals", "drift.metrics", "drift.core", "drift.core.plugins", "drift.core.hive", "drift.tools", "drift.automation", "drift.automation.mouse", "drift.hive_mind", "drift.hive_mind.protocol", "drift.trinity", "drift.trinity.adapters", "drift.trinity.council", "drift.trinity.sarif_pipeline", "drift.plugins"]

[tool.setuptools.package-dir]
drift = "drift"
"drift.interfaces" = "interfaces"
"drift.evals" = "evals"
"drift.metrics" = "metrics"
"drift.core" = "core"
"drift.core.plugins" = "core/plugins"
"drift.core.hive" = "core/hive"
"drift.tools" = "tools"
"drift.automation" = "automation"
"drift.automation.mouse" = "automation/mouse"
"drift.hive_mind" = "hive_mind"
"drift.hive_mind.protocol" = "hive_mind/protocol"
"drift.trinity" = "drift/trinity"
"drift.trinity.adapters" = "drift/trinity/adapters"
"drift.trinity.council" = "drift/trinity/council"
"drift.trinity.sarif_pipeline" = "drift/trinity/sarif_pipeline"
"drift.plugins" = "drift/plugins"



[project]
name = "drift"
version = "0.10.0"
description = "INFJ cognitive architecture bot — consciousness, emotion, intuition, shadow, and being"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Julien James", email = "hiimju9@gmail.com"}
]
keywords = ["ai", "agents", "cognitive-architecture", "consciousness", "infj", "embodiment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.136",
    "uvicorn>=0.46",
    "chromadb>=1.5",
    "torch>=2.11",
    "transformers>=4.57",
    "sentence-transformers>=4.1",
    "ollama>=0.6",
    "google-genai>=1.73",
    "google-generativeai>=0.8",
    "pydantic>=2.13",
    "httpx>=0.28",
    "rich>=15.0",
    "typer>=0.25",
    "mcp>=1.27",
    "playwright>=1.59",
    "numpy>=2.0",
    "pandas",
    "matplotlib",
    "sounddevice",
    "soundfile",
    "piper-tts>=1.4",
    "faster-whisper>=1.2",
    "python-dotenv>=1.2",
    "ddgs>=9.14.4",
    "PyYAML>=6.0",
    "markdown>=3.10",
    "psutil>=7.1",
    "tenacity>=9.1",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.136",
    "httpx>=0.28",
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
]
voice = [
    "piper-tts>=1.4",
    "sounddevice",
    "soundfile",
]
sarif-semantic = [
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "plotly>=6.0",
    "scikit-learn>=1.6",
]

[project.scripts]
drift = "drift.interfaces.cli:main"
trin = "drift.interfaces.cli:main"
anchor = "drift.interfaces.cli:main"

[tool.ruff.lint]
ignore = ["E402", "E702", "E731", "F841", "F401", "F811", "E701", "F821", "E722", "E741"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
    "ignore:legacy embedding function config:DeprecationWarning",
]
