[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"drift" = "."}
packages = ["drift", "drift.interfaces", "drift.evals", "drift.core", "drift.core.plugins", "drift.core.hive", "drift.tools", "drift.automation", "drift.automation.mouse", "drift.hive_mind", "drift.hive_mind.protocol"]

[project]
name = "drift"
version = "0.1.0"
description = "INFJ cognitive architecture bot — consciousness, emotion, intuition, shadow, and being"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Julien James", email = "hiimju9@gmail.com"}
]
keywords = ["ai", "agents", "cognitive-architecture", "consciousness", "infj", "embodiment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.136",
    "uvicorn>=0.46",
    "chromadb>=1.5",
    "torch>=2.11",
    "transformers>=4.57",
    "sentence-transformers>=4.1",
    "ollama>=0.6",
    "google-genai>=1.73",
    "google-generativeai>=0.8",
    "pydantic>=2.13",
    "httpx>=0.28",
    "rich>=15.0",
    "typer>=0.25",
    "mcp>=1.27",
    "playwright>=1.59",
    "numpy>=2.4",
    "pandas",
    "matplotlib",
    "sounddevice",
    "soundfile",
    "piper-tts>=1.4",
    "faster-whisper>=1.2",
    "python-dotenv>=1.2",
    "ddgs>=9.14.4",
    "PyYAML>=6.0",
    "markdown>=3.10",
    "psutil>=7.1",
    "tenacity>=9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
]
voice = [
    "piper-tts>=1.4",
    "sounddevice",
    "soundfile",
]

[project.scripts]
drift = "drift.interfaces.cli:main"

[tool.ruff.lint]
ignore = ["E402", "E702", "E731", "F841", "F401", "F811", "E701", "F821", "E722", "E741"]
