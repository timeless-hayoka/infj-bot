<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHI // DRIFT · Φ Glyph System</title>
  <style>
    :root {
      --bg-deep: #050505;
      --bg-surface: #0a0f14;
      --accent-orange: #FF5500;
      --accent-teal: #00e5c4;
      --accent-white: #f0f4f8;
      --text-muted: #8a9bb0;
      --border-dim: #1e2a36;
      --shadow-color: rgba(255, 0, 0, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--accent-white);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 20px 30px;
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-family: Arial Black, sans-serif;
      font-size: 1.4rem;
      letter-spacing: -1px;
      color: var(--accent-white);
    }

    header h1 span { color: var(--accent-orange); }

    .status {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .status.online::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent-teal);
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1px;
      background: var(--border-dim);
    }

    .canvas-wrap {
      background: var(--bg-deep);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#glyphCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
    }

    .overlay .dii-readout {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--accent-teal);
      line-height: 1;
    }

    .overlay .dii-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: 4px;
    }

    aside {
      background: var(--bg-surface);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      border: 1px solid var(--border-dim);
      padding: 16px;
    }

    .panel h3 {
      font-size: 0.65rem;
      color: var(--accent-orange);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .need-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.8rem;
    }

    .need-row:last-child { border-bottom: none; }

    .need-name { color: var(--text-muted); }
    .need-val { color: var(--accent-white); font-weight: 700; }

    .need-bar {
      height: 3px;
      background: rgba(255,255,255,0.06);
      margin-top: 4px;
      position: relative;
    }

    .need-bar-fill {
      height: 100%;
      background: var(--accent-orange);
      transition: width 0.6s ease;
    }

    .shadow-readout {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .shadow-ring {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid var(--border-dim);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shadow-ring-fill {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #ff3333;
      border-right-color: #ff3333;
      transition: transform 0.6s ease;
    }

    .shadow-pct {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ff6666;
    }

    .shadow-status {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .council-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .council-node {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }

    .council-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-teal);
      box-shadow: 0 0 6px var(--accent-teal);
    }

    .council-dot.standby { background: var(--text-muted); box-shadow: none; }
    .council-dot.active  { background: var(--accent-orange); box-shadow: 0 0 6px var(--accent-orange); }

    .network-stats {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .back-link {
      display: block;
      text-align: center;
      padding: 12px;
      background: var(--accent-orange);
      color: var(--bg-deep);
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      transition: all 0.2s;
    }

    .back-link:hover { background: var(--accent-white); }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { max-height: 40vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>PHI <span>//</span> DRIFT · Φ Glyph System</h1>
    <div class="status online" id="connectionStatus">LIVE TELEMETRY</div>
  </header>

  <main>
    <div class="canvas-wrap">
      <canvas id="glyphCanvas"></canvas>
      <div class="overlay">
        <div class="dii-readout" id="diiValue">0.76</div>
        <div class="dii-label" id="diiLabel">DII · COHERENT</div>
      </div>
    </div>

    <aside>
      <div class="panel">
        <h3>Homeostatic Needs</h3>
        <div id="needsPanel"></div>
      </div>

      <div class="panel">
        <h3>Shadow Layer</h3>
        <div class="shadow-readout">
          <div class="shadow-ring">
            <div class="shadow-ring-fill" id="shadowRing"></div>
            <span class="shadow-pct" id="shadowPct">8%</span>
          </div>
          <div>
            <div class="shadow-status" id="shadowStatus">WHISPER</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>Council Status</h3>
        <div class="council-list" id="councilPanel">
          <div class="council-node"><span class="council-dot"></span>spark-0 · PRIMARY · ONLINE</div>
          <div class="council-node"><span class="council-dot standby"></span>seed-1 · CRITIC · STANDBY</div>
          <div class="council-node"><span class="council-dot active"></span>lantern-4 · WATCHER · ACTIVE</div>
          <div class="council-node"><span class="council-dot"></span>nexus · CONDUCTOR · ONLINE</div>
        </div>
      </div>

      <div class="panel">
        <h3>Network</h3>
        <div class="network-stats">
          <span id="netRaw">raw: 0.00 KB</span>
          <span id="netInterval">interval: 1000ms</span>
        </div>
      </div>

      <a href="/" class="back-link">← Return to Dashboard</a>
    </aside>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // ── State ───────────────────────────────────────────────────────────────
    let state = {
      needs: {
        Energy: 0.82, Coherence: 0.88, Integration: 0.75,
        Connection: 0.60, Growth: 0.71, Autonomy: 0.85, Integrity: 0.94
      },
      shadow_influence: 0.08,
      dii: 0.76,
      phi_proxy: 0.62,
      turn_count: 0,
      network_stats: { raw_kb: 0, comp_kb: 0, interval_ms: 1000 }
    };

    const needKeys = Object.keys(state.needs);
    const needColors = [
      '#FF5500', '#FF7733', '#FF9955', '#00e5c4',
      '#55aaff', '#aa55ff', '#ff55aa'
    ];

    // ── Canvas Setup ────────────────────────────────────────────────────────
    const canvas = document.getElementById('glyphCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, cx, cy, radius;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      W = canvas.width;
      H = canvas.height;
      cx = W / 2;
      cy = H / 2;
      radius = Math.min(W, H) * 0.35;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      W /= window.devicePixelRatio;
      H /= window.devicePixelRatio;
      cx /= window.devicePixelRatio;
      cy /= window.devicePixelRatio;
      radius /= window.devicePixelRatio;
    }
    window.addEventListener('resize', resize);
    resize();

    // ── Drawing ─────────────────────────────────────────────────────────────
    function draw() {
      ctx.clearRect(0, 0, W, H);

      const time = Date.now() * 0.001;
      const n = needKeys.length;
      const angles = needKeys.map((_, i) => (Math.PI * 2 * i / n) - Math.PI / 2);

      // Background grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let r = 0.2; r <= 1; r += 0.2) {
        ctx.beginPath();
        for (let i = 0; i <= n; i++) {
          const a = angles[i % n];
          const x = cx + Math.cos(a) * radius * r;
          const y = cy + Math.sin(a) * radius * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // Radial lines
      for (let i = 0; i < n; i++) {
        const a = angles[i];
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
        ctx.stroke();
      }

      // Shadow overlay (reduced opacity polygon behind)
      if (state.shadow_influence > 0.02) {
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const a = angles[i];
          const shadowR = radius * (1 + state.shadow_influence * 0.3);
          const x = cx + Math.cos(a + time * 0.1) * shadowR;
          const y = cy + Math.sin(a + time * 0.1) * shadowR;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = `rgba(255, 50, 50, ${state.shadow_influence * 0.15})`;
        ctx.fill();
      }

      // Need polygon
      ctx.beginPath();
      const points = [];
      for (let i = 0; i < n; i++) {
        const a = angles[i];
        const v = state.needs[needKeys[i]];
        const r = radius * v;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        points.push({ x, y, v, a });
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      // Fill with gradient based on DII
      const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      const diiHue = state.dii > 0.8 ? 170 : state.dii > 0.6 ? 200 : state.dii > 0.4 ? 30 : 0;
      gradient.addColorStop(0, `hsla(${diiHue}, 80%, 50%, 0.25)`);
      gradient.addColorStop(1, `hsla(${diiHue}, 80%, 50%, 0.05)`);
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.strokeStyle = `hsla(${diiHue}, 80%, 55%, 0.6)`;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Need vertices (glowing dots)
      for (let i = 0; i < n; i++) {
        const p = points[i];
        const color = needColors[i];
        const pulse = 1 + Math.sin(time * 2 + i) * 0.15;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 6 * pulse, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(p.x, p.y, 12 * pulse, 0, Math.PI * 2);
        ctx.fillStyle = color.replace(')', ', 0.15)').replace('rgb', 'rgba');
        ctx.fill();

        // Labels
        const labelR = radius + 28;
        const lx = cx + Math.cos(p.a) * labelR;
        const ly = cy + Math.sin(p.a) * labelR;
        ctx.fillStyle = color;
        ctx.font = '600 11px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(needKeys[i].toUpperCase(), lx, ly);
      }

      // Center core (DII)
      const corePulse = 1 + Math.sin(time * 3) * 0.1;
      const coreR = 18 * corePulse * state.dii;

      ctx.beginPath();
      ctx.arc(cx, cy, coreR + 8, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${diiHue}, 80%, 50%, 0.2)`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${diiHue}, 80%, 55%, 0.9)`;
      ctx.fill();

      // Phi proxy orbit ring
      const orbitR = radius * 0.55;
      ctx.beginPath();
      ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 85, 0, 0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Orbiting council nodes
      const councilNodes = [
        { name: 'spark', offset: 0, color: '#FF5500' },
        { name: 'seed', offset: Math.PI / 2, color: '#00e5c4' },
        { name: 'lantern', offset: Math.PI, color: '#FF5500' },
        { name: 'nexus', offset: Math.PI * 1.5, color: '#55aaff' }
      ];

      for (const node of councilNodes) {
        const a = time * 0.4 + node.offset;
        const x = cx + Math.cos(a) * orbitR;
        const y = cy + Math.sin(a) * orbitR;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = node.color;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.fillStyle = node.color.replace(')', ', 0.2)').replace('rgb', 'rgba');
        ctx.fill();
      }

      // Turn counter ring
      if (state.turn_count > 0) {
        const turnArc = (state.turn_count % 100) / 100 * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(cx, cy, radius + 12, -Math.PI / 2, -Math.PI / 2 + turnArc);
        ctx.strokeStyle = 'rgba(255, 85, 0, 0.3)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }

    // ── DOM Updates ─────────────────────────────────────────────────────────
    function updateDOM() {
      // DII
      document.getElementById('diiValue').textContent = state.dii.toFixed(3);
      const diiLabel = state.dii >= 0.8 ? 'COHERENT' : state.dii >= 0.6 ? 'STABLE' :
                        state.dii >= 0.4 ? 'DRIFTING' : 'REVIEW';
      document.getElementById('diiLabel').textContent = `DII · ${diiLabel}`;

      // Needs
      const needsPanel = document.getElementById('needsPanel');
      needsPanel.innerHTML = '';
      needKeys.forEach((key, i) => {
        const val = state.needs[key];
        const row = document.createElement('div');
        row.className = 'need-row';
        row.innerHTML = `
          <span class="need-name">${key}</span>
          <span class="need-val">${Math.round(val * 100)}%</span>
        `;
        const bar = document.createElement('div');
        bar.className = 'need-bar';
        bar.innerHTML = `<div class="need-bar-fill" style="width:${val * 100}%; background:${needColors[i]}"></div>`;
        needsPanel.appendChild(row);
        needsPanel.appendChild(bar);
      });

      // Shadow
      const shadowPct = Math.round(state.shadow_influence * 100);
      document.getElementById('shadowPct').textContent = shadowPct + '%';
      document.getElementById('shadowRing').style.transform = `rotate(${shadowPct * 3.6}deg)`;
      const shadowStatus = state.shadow_influence < 0.15 ? 'WHISPER' :
                            state.shadow_influence < 0.25 ? 'ACTIVE' : 'ELEVATED';
      document.getElementById('shadowStatus').textContent = shadowStatus;

      // Network
      const raw = state.network_stats?.raw_kb || 0;
      const interval = state.network_stats?.interval_ms || 1000;
      document.getElementById('netRaw').textContent = `raw: ${raw.toFixed(2)} KB`;
      document.getElementById('netInterval').textContent = `interval: ${interval}ms`;
    }

    // ── Socket.IO ───────────────────────────────────────────────────────────
    const socket = io();

    socket.on('observatory_delta', (delta) => {
      if (delta.needs) state.needs = delta.needs;
      if (delta.shadow_influence !== undefined) state.shadow_influence = delta.shadow_influence;
      if (delta.dii !== undefined) state.dii = delta.dii;
      if (delta.phi_proxy !== undefined) state.phi_proxy = delta.phi_proxy;
      if (delta.turn_count !== undefined) state.turn_count = delta.turn_count;
      if (delta.network_stats) state.network_stats = delta.network_stats;
      updateDOM();
    });

    socket.on('connect', () => {
      document.getElementById('connectionStatus').textContent = 'LIVE TELEMETRY';
      document.getElementById('connectionStatus').classList.add('online');
    });

    socket.on('disconnect', () => {
      document.getElementById('connectionStatus').textContent = 'OFFLINE';
      document.getElementById('connectionStatus').classList.remove('online');
    });

    // ── Init ────────────────────────────────────────────────────────────────
    updateDOM();
    draw();
  </script>
</body>
</html>
